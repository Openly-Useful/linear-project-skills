name: Release Linear Project MCP server

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    if: github.event.release.prerelease == false && startsWith(github.event.release.tag_name, 'linear-project-mcp-server-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.34.0"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        working-directory: mcp/linear-project-mcp-server
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "linear-project-mcp-server-v$PACKAGE_VERSION"
      - name: Verify release commit belongs to main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Validate public distribution
        run: python3 scripts/validate.py --external-publication
      - name: Install MCP dependencies
        working-directory: mcp/linear-project-mcp-server
        run: pnpm install --frozen-lockfile
      - name: Test and build MCP server
        working-directory: mcp/linear-project-mcp-server
        run: pnpm check
      - name: Inspect npm package contents
        working-directory: mcp/linear-project-mcp-server
        run: pnpm pack --dry-run
      - name: Publish public package with provenance
        working-directory: mcp/linear-project-mcp-server
        env:
          # Trusted publishing uses OIDC and ignores this fallback. The secret is
          # needed only if npm cannot yet configure OIDC for the first publish.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
