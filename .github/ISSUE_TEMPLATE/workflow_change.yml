name: Workflow change
description: Propose a new capability or a change to workflow authority
title: "[Proposal] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What repeatable Linear project problem is not covered today?
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Synthetic scenario
      description: Show how a user would invoke the workflow using synthetic data.
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Authority and scope impact
      description: Explain which reads or writes would be added and how unrelated work remains protected.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Describe a dry-run or deterministic check that would prove the change behaves safely.
    validations:
      required: true
